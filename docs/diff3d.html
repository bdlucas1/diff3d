<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>STL Viewer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #file {
      position: absolute;
      z-index: 10;
      margin: 10px;
    }

    #viewer {
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<input id="file" type="file" accept=".stl">
<div id="viewer"></div>

<script type="module" src="diff3d.js">

</script>

</body>
</html>
