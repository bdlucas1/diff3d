<!doctype html>
<html>

  <head>
    <meta charset="utf-8">
    <title>diff3d</title>

    <style>
      html, body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
      }

      #ui {
          font-family: sans-serif;
          font-size: 10pt;
          position: absolute;
          z-index: 10;
          margin: 2em;
          display: flex;
          flex-direction: column;
          gap: 0.8em;
      }

      #viewer {
          width: 100%;
          height: 100%;
      }
    </style>

    <script type="importmap">
      {
          "imports": {
              "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
              "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
      }
    </script>
  </head>

  <body>
    <div id="ui">
      <div>
        Choose two STL files for comparison. All computation is done in your browser - your files
        are not uploaded to a server, and they never leave your computer. 
      </div>
      <input id="file1" type="file" accept=".stl">
      <input id="file2" type="file" accept=".stl">
    </div>
    <div id="viewer"></div>
    <script type="module" src="diff3d.js"></script>
  </body>

</html>
