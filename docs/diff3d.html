<!doctype html>
<html>

  <head>
    <meta charset="utf-8">
    <title>diff3d</title>

    <style>
      html, body {
          margin: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
      }

      #file-choosers {
          position: absolute;
          z-index: 10;
          margin: 10px;
          display: flex;
          flex-direction: column;
          gap: 8px;
      }

      #file-choosers label {
          display: flex;
          align-items: center;
          gap: 8px;
      }

      #viewer {
          width: 100%;
          height: 100%;
      }
    </style>

    <script type="importmap">
      {
          "imports": {
              "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
              "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
          }
      }
    </script>
  </head>

  <body>
    <div id="file-choosers">
      <label>File 1 <input id="file1" type="file" accept=".stl"></label>
      <label>File 2 <input id="file2" type="file" accept=".stl"></label>
    </div>
    <div id="viewer"></div>
    <script type="module" src="diff3d.js"></script>
  </body>

</html>
